name: Minify event scripts

on:
  push:
    branches-ignore:
      - main
    paths:
      - event-scripts.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minify:
    if: github.actor != 'github-actions[bot]' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Minify event script
        run: npx terser@5.31.1 event-scripts.js --compress --mangle --output event-scripts.min.js

      - name: Commit minified script
        shell: bash
        run: |
          if git diff --quiet -- event-scripts.min.js; then
            echo "No minified changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add event-scripts.min.js
          git commit -m "chore: update minified event script"
          git push